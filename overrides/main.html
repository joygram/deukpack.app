{% extends "base.html" %}

{% block announce %}
  {{ config.extra.announce }}
{% endblock %}

{% block scripts %}
  {{ super() }}
  <script>
  (function() {
    // Already on /ko/ path - skip
    if (location.pathname.startsWith('/ko/')) return;
    
    // User manually chose a language - skip
    if (localStorage.getItem('dp-lang-chosen')) return;
    
    // Korean browser → redirect to /ko/
    var lang = navigator.language || navigator.userLanguage;
    if (lang.startsWith('ko')) {
      var newPath = '/ko' + location.pathname;
      if (location.pathname === '/') newPath = '/ko/';
      location.replace(newPath + location.search + location.hash);
    }
  })();
  
  // Remember language choice when switcher is clicked
  document.addEventListener('DOMContentLoaded', function() {
    var langLinks = document.querySelectorAll('.md-select__link[hreflang]');
    langLinks.forEach(function(link) {
      link.addEventListener('click', function() {
        localStorage.setItem('dp-lang-chosen', '1');
      });
    });
  });
  </script>
{% endblock %}
