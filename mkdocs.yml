# deukpack.app — 제품 소개, 문서, API 레퍼런스 등 공식 사이트

site_name: DeukPack 제품 소개
site_description: 득팩(DeukPack) — 무료·바로 적용 가능한 코어 라이브러리. 브랜드 컨셉. 코어·엔진, 프로토콜, 파이프라인·Unity, 확장. Excel 프로토콜·애드인은 별도 배포.
site_url: https://deukpack.app/

extra:
  generator: false

markdown_extensions:
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

nav:
  - 홈: index.md
  - 제품:
    - 제품군 개요: products/index.md
    - AI·에이전트 파이프라인: ai-pipeline-integration.md
    - 코어·엔진: products/core-engine.md
    - 프로토콜: products/protocol.md
    - Excel 애드인: products/excel-addin.md
    - 파이프라인·Unity: products/pipeline-unity.md
    - 확장 제품군: products/extension.md
    - 제품 관계도: architecture.md
  - 레퍼런스 가이드:
    - 개요: reference/index.md
    - API·타입 참조: reference/api.md
  - 튜토리얼:
    - 개요: tutorial/index.md
    - 빠른 시작: tutorial/quickstart.md
  - 스타터 키트: starter-kits.md
  - 포지셔닝: positioning.md
  - 라이선스·비용: license.md

theme:
  name: material
  language: ko
  logo: assets/deukpack-icon-crop.png
  palette:
    # 기본: 다크 테마 (세련된 톤)
    - scheme: slate
      primary: cyan
      accent: amber
      toggle:
        icon: material/brightness-7
        name: 라이트 모드로 전환
    - scheme: default
      primary: indigo
      accent: amber
      toggle:
        icon: material/brightness-4
        name: 다크 모드로 전환
      media: "(prefers-color-scheme: light)"
  font:
    text: Noto Sans KR
    code: JetBrains Mono
  features:
    - navigation.tabs
    - navigation.expand
    - navigation.sections
    - navigation.top
    - content.tabs.link
    - content.code.copy
  icon:
    repo: fontawesome/brands/github

extra_css:
  - stylesheets/extra.css

plugins:
  - search
