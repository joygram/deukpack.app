# deukpack.app — 제품 소개, 문서, API 레퍼런스 등 공식 사이트

site_name: DeukPack 제품 소개
site_description: 득팩(DeukPack) — 무료·바로 적용 가능한 코어 라이브러리. 브랜드 컨셉. 코어·엔진, 프로토콜, 파이프라인·Unity, 확장. Excel 프로토콜·애드인은 별도 배포.
site_url: https://deukpack.app/

extra:
  generator: false
  # 배너 문구 정본: DeukPack 루트 release-notice.json → npm run release-notice:apply
  announce: >-
    <strong>득팩 코어 1.2.0</strong> —
    <a href="https://github.com/joygram/DeukPack/releases/latest">GitHub Releases</a>
    · <a href="https://deukpack.app/releases/">릴리스 요약</a>
    · <a href="https://deukpack.app/en/releases/">EN</a>

markdown_extensions:
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.snippets:
      base_path: ["docs"]
      check_paths: true

nav:
  - 홈: index.md
  - 문서 안내: documentation-index.md
  - 릴리스·뉴스: releases.md
  - 득팩 키트 라인업: starter-kits.md
  - 제품:
    - 제품군 개요: products/index.md
    - AI·에이전트 파이프라인: ai-pipeline-integration.md
    - AI 도구 연동(Antigravity·Cursor 등): ai-ide-tools-guide.md
    - 코어·엔진: products/core-engine.md
    - 프로토콜: products/protocol.md
    - Excel 애드인: products/excel-addin.md
    - 파이프라인·Unity: products/pipeline-unity.md
    - 확장 제품군: products/extension.md
    - 제품 관계도: architecture.md
  - 레퍼런스 가이드:
    - 개요: reference/index.md
    - 기본 구성: reference/fundamentals.md
    - 테이블: reference/tables.md
    - 메시지·와이어: reference/messages.md
    - 와이어·프로토콜 계열: reference/wire-protocols.md
    - DB·엔티티: reference/database.md
    - API·타입 참조: reference/api.md
  - 튜토리얼:
    - 개요: tutorial/index.md
    - 배포본 vs 소스본: tutorial/distribution-vs-source.md
    - 설치 (Windows·Linux): tutorial/install-os.md
    - 빠른 시작: tutorial/quickstart.md
    - IDL 가이드: tutorial/idl-guide.md
    - 프로토콜·직렬화: tutorial/protocol-serialization.md
    - C# 가이드: tutorial/csharp-guide.md
    - C++ 가이드: tutorial/cpp-guide.md
    - 파이프라인 만들기: tutorial/pipeline-guide.md
    - WriteWithOverrides·WriteFields·extends: tutorial/write-with-overrides.md
  - 포지셔닝: positioning.md
  - 라이선스·비용: license.md

theme:
  name: material
  language: ko
  logo: assets/deukpack-icon-crop.png
  palette:
    # 기본: 다크 테마 (세련된 톤)
    - scheme: slate
      primary: cyan
      accent: amber
      toggle:
        icon: material/brightness-7
        name: 라이트 모드로 전환
    - scheme: default
      primary: indigo
      accent: amber
      toggle:
        icon: material/brightness-4
        name: 다크 모드로 전환
      media: "(prefers-color-scheme: light)"
  font:
    text: Noto Sans KR
    code: JetBrains Mono
  features:
    - navigation.tabs
    - navigation.expand
    - navigation.sections
    - navigation.top
    - content.tabs.link
    - content.code.copy
  icon:
    repo: fontawesome/brands/github

extra_css:
  - stylesheets/extra.css

plugins:
  - i18n:
      docs_structure: suffix
      fallback_to_default: true
      reconfigure_material: true
      languages:
        - locale: ko
          default: true
          name: 한국어
          build: true
        - locale: en
          name: English
          build: true
          nav_translations:
            문서 안내: Documentation
            홈: Home
            릴리스·뉴스: Releases · news
            득팩 키트 라인업: Kits lineup
            제품: Products
            제품군 개요: Products overview
            AI·에이전트 파이프라인: AI / agent pipeline
            AI 도구 연동(Antigravity·Cursor 등): AI tools (Antigravity, Cursor, …)
            코어·엔진: Core · engine
            프로토콜: Protocol
            Excel 애드인: Excel add-in
            파이프라인·Unity: Pipeline · Unity
            확장 제품군: Extension
            제품 관계도: Architecture
            레퍼런스 가이드: Reference
            개요: Overview
            기본 구성: Fundamentals
            테이블: Tables
            메시지·와이어: Messages & wire
            와이어·프로토콜 계열: Wire protocol families
            DB·엔티티: Database & entities
            API·타입 참조: API reference
            튜토리얼: Tutorial
            배포본 vs 소스본: Distribution vs source
            설치 (Windows·Linux): Install (Windows · Linux)
            빠른 시작: Quick start
            IDL 가이드: IDL guide
            프로토콜·직렬화: Protocol & serialization
            C# 가이드: C# guide
            C++ 가이드: C++ guide
            파이프라인 만들기: Pipeline guide
            WriteWithOverrides·WriteFields·extends: Overrides · WriteFields · extends
            포지셔닝: Positioning
            라이선스·비용: License
  - search
