# deukpack.app — Product info, docs, API reference (official site)

site_name: DeukPack
site_description: DeukPack — Free, ready-to-use core library. Brand concept. Core · engine, protocol, pipeline · Unity, extensions. Excel protocol add-in distributed separately.
site_url: https://deukpack.app/

extra:
  generator: false
  announce: >-
    <strong>득팩 코어 1.5.0</strong> — Java 패리티(상속, Compact/TJSON 추가) · MCP 코어 분리 · 전수 보안 가드 도입 —
    <a href="https://github.com/joygram/DeukPack/releases/latest">GitHub Releases</a>
    · <a href="https://deukpack.app/releases/">릴리스 요약</a>
    · <a href="https://deukpack.app/releases/">EN</a>

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - toc:
      slugify: !!python/object/apply:pymdownx.slugs.slugify
        kwds:
          case: lower
      permalink: true
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.snippets:
      base_path: ["docs"]
      check_paths: true

nav:
  - Home: index.md
  - Documentation: documentation-index.md
  - Releases · news: releases.md
  - Kits lineup: deukpack-kits.md
  - Products:
    - Products overview: products/index.md
    - AI / agent pipeline: ai-pipeline-integration.md
    - AI tools (Antigravity, Cursor, …): ai-ide-tools-guide.md
    - Core · engine: products/core-engine.md
    - Protocol: products/protocol.md
    - Excel add-in: products/excel-addin.md
    - Pipeline · Unity: products/pipeline-unity.md
    - DeukNavigation: products/navigation.md
    - DeukPackMcp (Universal Hub): products/mcp-hub.md
    - DeukPackMcp (Universal AI Hub) 🚧: products/mcp-hub.md
    - Extension: products/extension.md
    - Architecture: architecture.md
  - Reference:
    - Overview: reference/index.md
    - Fundamentals: reference/fundamentals.md
    - Tables: reference/tables.md
    - Messages & wire: reference/messages.md
    - Wire protocol families: reference/wire-protocols.md
    - Database & entities: reference/database.md
    - API reference: reference/api.md
  - Tutorial:
    - Overview: tutorial/index.md
    - Distribution vs source: tutorial/distribution-vs-source.md
    - Install (Windows · Linux): tutorial/install-os.md
    - Quick start: tutorial/quickstart.md
    - IDL guide: tutorial/idl-guide.md
    - Protocol & serialization: tutorial/protocol-serialization.md
    - C# guide: tutorial/csharp-guide.md
    - C++ guide: tutorial/cpp-guide.md
    - Pipeline guide: tutorial/pipeline-guide.md
    - Unified Write · field selection · extends: tutorial/write-with-overrides.md
  - Positioning: positioning.md
  - Journal:
    - "Episode 1. Birth of DeukPack IDL": journal/ai-control-plane-design.md
  - License: license.md

theme:
  name: material
  custom_dir: overrides
  language: en
  logo: assets/deukpack-icon-crop.png
  palette:
    - scheme: slate
      primary: cyan
      accent: amber
      toggle:
        icon: material/brightness-7
        name: Switch to light mode
    - scheme: default
      primary: indigo
      accent: amber
      toggle:
        icon: material/brightness-4
        name: Switch to dark mode
      media: "(prefers-color-scheme: light)"
  font:
    text: Noto Sans KR
    code: JetBrains Mono
  features:
    - navigation.tabs
    - navigation.expand
    - navigation.sections
    - navigation.top
    - content.tabs.link
    - content.code.copy
  icon:
    repo: fontawesome/brands/github

extra_css:
  - stylesheets/extra-v2.css

extra_javascript:
  - javascripts/dynamic-release-notice-v2.js
  - javascripts/table-scroll-indicator.js

plugins:
  - i18n:
      docs_structure: suffix
      fallback_to_default: true
      reconfigure_material: true
      languages:
        - locale: en
          default: true
          name: English
          build: true
        - locale: ko
          name: 한국어
          build: true
          nav_translations:
