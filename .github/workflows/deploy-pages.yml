# GitHub Pages 배포 — MkDocs 빌드 후 배포
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Inject release notice (DeukPack OSS 정본)
        run: |
          curl -fsSL -o /tmp/release-notice.json \
            "https://raw.githubusercontent.com/joygram/DeukPack/main/release-notice.json"
          curl -fsSL -o /tmp/apply-release-notice.js \
            "https://raw.githubusercontent.com/joygram/DeukPack/main/scripts/apply-release-notice.js"
          node /tmp/apply-release-notice.js \
            --json /tmp/release-notice.json \
            --mkdocs mkdocs.yml \
            --write-includes docs/_includes \
            --product-notices

      - name: Build MkDocs
        run: mkdocs build --strict

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
